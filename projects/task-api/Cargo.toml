[package]
name = "task-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
async-graphql = "7"
async-graphql-actix-web = "7"
diesel = { version = "2", features = ["sqlite", "r2d2"] }
env_logger = "0.11"
log = "0.4"
# SQLite本体を同梱してビルドし、OS側の開発ライブラリを必須にしない。
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
actix-http = "3"
serde_json = "1"
